<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Pour Madeleine ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cr:#fff8f1;--po:#f6d3d9;--ro:#e8a0ae;--bo:#6b1d34;--or:#c9a15b;--ink:#4a2a33;--soft:#8a6470;
--d:'Cormorant Garamond',Georgia,serif;--b:'Jost',system-ui,-apple-system,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(circle at 20% 0,#fde4e8,transparent 55%),radial-gradient(circle at 90% 100%,#f3d9c4,transparent 50%),var(--cr);color:var(--ink);font:400 17px/1.65 var(--b);min-height:100%;overflow-x:hidden}
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.p{position:absolute;top:-30px;background:linear-gradient(135deg,var(--ro),var(--bo));border-radius:150% 0 150% 0;opacity:.55;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(540deg)}}
header{position:fixed;top:0;left:0;right:0;z-index:20;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 8px;display:flex;align-items:center;gap:10px;background:rgba(255,248,241,.82);backdrop-filter:blur(10px)}
.tr{flex:1;height:5px;border-radius:9px;background:var(--po);overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--ro),var(--bo),var(--or));transition:width .5s}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--or);background:#fff;color:var(--bo);font-size:17px;cursor:pointer}
main{position:relative;z-index:5;max-width:620px;margin:0 auto;padding:78px 18px 50px;opacity:0;transform:translateY(14px);transition:.6s}
main.in{opacity:1;transform:none}
h1,h2,h3{font-family:var(--d);font-weight:600;color:var(--bo);line-height:1.15}
h1{font-size:clamp(46px,14vw,74px);font-style:italic;background:linear-gradient(120deg,var(--bo),#b0405c,var(--or));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;margin:8px 0}
h2{font-size:32px;margin-bottom:6px}
.c{text-align:center}.sub{color:var(--soft);font-size:15px;margin-bottom:18px}
.k{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--or)}
.card{background:rgba(255,255,255,.72);border:1px solid rgba(201,161,91,.45);border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 14px 34px -22px var(--bo)}
.names{font-family:var(--d);font-style:italic;font-size:22px;color:var(--bo);margin:18px 0}
.names i{color:var(--or);font-style:normal}
.btn{display:inline-block;border:0;border-radius:40px;padding:14px 26px;font:500 16px var(--b);cursor:pointer;color:#fff;background:linear-gradient(135deg,#b0405c,var(--bo));box-shadow:0 10px 24px -10px var(--bo);transition:transform .2s}
.btn:active{transform:scale(.96)}
.btn.g{background:#fff;color:var(--bo);border:1px solid var(--or);box-shadow:none}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.glow{animation:gl 2.6s ease-in-out infinite}
@keyframes gl{50%{box-shadow:0 0 0 10px rgba(201,161,91,.18),0 10px 24px -10px var(--bo)}}
.letter{font-family:var(--d);font-size:21px;line-height:1.6;color:#53303a}
.letter p{margin:0 0 14px}
.q{margin:20px 0}
.q label{display:block;font-weight:500;margin-bottom:9px}
input[type=text],textarea{width:100%;border:1px solid #e7c9cf;border-radius:14px;padding:12px 14px;font:16px var(--b);background:#fffdfb;color:var(--ink);resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--or);border-color:transparent}
.ch{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #e1b9c1;background:#fff;color:var(--bo);border-radius:30px;padding:9px 15px;font:15px var(--b);cursor:pointer;transition:.2s}
.chip.on{background:var(--bo);color:#fff;border-color:var(--bo)}
input[type=range]{width:100%;accent-color:var(--bo)}
.sl{display:flex;justify-content:space-between;font-size:13px;color:var(--soft)}.sl b{color:var(--bo)}
.env{position:relative;height:96px;background:var(--po);border-radius:12px;margin:10px 0 0;cursor:pointer;overflow:hidden;display:grid;place-items:center;font-size:42px}
.flap{position:absolute;top:0;left:0;right:0;height:62px;background:var(--ro);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s}
.env.open .flap{transform:rotateX(180deg);opacity:.4}
.rev{max-height:0;overflow:hidden;opacity:0;transition:.8s;font-family:var(--d);font-size:21px;font-style:italic;color:var(--bo)}
.rev.open{max-height:700px;opacity:1;margin-top:14px}
.rev li{list-style:none;margin:8px 0;animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.fl{position:fixed;z-index:60;pointer-events:none;font-size:28px;animation:rise 1.8s ease-out forwards}
@keyframes rise{to{transform:translate(var(--x),-190px) scale(1.5);opacity:0}}
.mono{font-size:13px;min-height:150px}
.ok{color:var(--soft);font-size:14px;margin-top:8px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="fx"></div>
<header><button class="ib" id="back" aria-label="Retour">←</button><div class="tr"><div id="bar"></div></div><button class="ib" data-act="music" id="mus" aria-label="Musique">♪</button></header>
<main id="app"></main>
<script>
// ====== CONFIG ======
// Mets ton numéro WhatsApp avec l’indicatif, sans + ni espaces (ex. "223XXXXXXXX").
// Laisse vide : WhatsApp s’ouvrira et Madeleine choisira ton contact.
const NUM="";
// Adresse Formspree : les réponses arrivent dans la boîte mail de Raphaël.
const FORM="https://formspree.io/f/meaevbzr";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let A={};try{A=JSON.parse(localStorage.getItem("mmA")||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem("mmA",JSON.stringify(A))}catch(e){}};

// t=texte court, a=zone libre, c=choix (options séparées par |), s=curseur 0-10 (libellés gauche|droite)
const CATS=[
{t:"Apprenons à mieux nous connaître",q:[
["Qu’est-ce qui te fait sourire même lorsque ta journée est mauvaise ?","t"],
["Quelle est la petite chose qui peut immédiatement te mettre de bonne humeur ?","c","Une chanson|Un bon repas|Un message doux|Un câlin|Autre chose"],
["Quel est le côté de ta personnalité que peu de gens connaissent ?","a"],
["Qu’est-ce que tu aimerais que je comprenne mieux chez toi ?","a"],
["Quelle est la chose qui te rend différente des autres à tes yeux ?","t"],
["Es-tu plutôt du matin ou du soir ?","s","Très matinale|Oiseau de nuit"]]},
{t:"Ton langage de l’amour",q:[
["Qu’est-ce qui te fait te sentir vraiment aimée ?","a"],
["Tu préfères les longs messages doux, les appels spontanés ou les petites surprises ?","c","Longs messages doux|Appels spontanés|Petites surprises"],
["Tu préfères recevoir des compliments ou voir l’amour à travers des actes ?","c","Des compliments|Des actes|Un mélange des deux"],
["Quelle attention venant de moi pourrait illuminer ta journée ?","t"],
["Quel surnom amoureux aimerais-tu que je te donne ?","t"],
["Ton besoin de câlins, c’est plutôt…","s","Raisonnable|Illimité 🤗"]]},
{t:"Notre petite complicité",q:[
["Quel serait notre rendez-vous idéal ?","c","Dîner aux chandelles|Balade au coucher du soleil|Ciné et glaces|Pique-nique|Surprends-moi"],
["Si nous avions une journée entière rien que pour nous, que voudrais-tu faire ?","a"],
["Qui de nous deux risque d’être le plus jaloux ? 😂","c","Moi 😅|Toi 😏|Les deux|Aucun des deux"],
["Qui va faire le premier pas après une petite dispute ?","c","Moi|Toi|Les deux en même temps|On ne se dispute pas 😇"],
["Quel défi amusant aimerais-tu qu’on fasse ensemble ?","t"],
["Quelle chanson pourrait devenir notre chanson ?","t"],
["Si tu devais décrire notre début d’histoire en trois mots, lesquels choisirais-tu ?","t"],
["Sur 10, à quel point je te fais rire ? (réponds honnêtement 😏)","s","Pas du tout|Je pleure de rire"],
["Choisis un emoji qui te représente","c","🌹|✨|🦋|☀️|🔥|🍓"]]},
{t:"Les questions qui font fondre",q:[
["Quel moment avec moi aimerais-tu vivre bientôt ?","a"],
["Qu’est-ce que tu aimerais que je te dise plus souvent ?","t"],
["Quel geste romantique te toucherait vraiment ?","a"],
["Quelle petite habitude aimerais-tu qu’on crée tous les deux ?","t"],
["Qu’est-ce qui pourrait te faire penser à moi en plein milieu de ta journée ?","t"],
["Quel message aimerais-tu recevoir de moi un jour où tu ne te sens pas bien ?","a"]]},
{t:"Construisons quelque chose de beau",q:[
["Qu’est-ce qui est essentiel pour toi dans une relation ?","a"],
["Comment préfères-tu qu’on règle nos désaccords ?","c","On en parle calmement tout de suite|On prend un peu de temps|Par écrit|Un câlin d’abord"],
["Qu’est-ce qui te permet de faire confiance à quelqu’un ?","t"],
["Quelle place accordes-tu à la communication dans un couple ?","s","Secondaire|Essentielle"],
["Qu’aimerais-tu qu’on apprenne à faire ensemble au fil du temps ?","t"],
["Quelle est la chose que tu souhaites préserver dans notre relation ?","t"]]},
{t:"Le coin des réponses secrètes",q:[
["Une chose que j’aimerais te dire mais que je n’ai pas encore osé dire…","a"],
["La première chose qui m’a plu chez toi…","a"],
["Ce que j’aimerais vivre avec toi…","a"],
["Une question que j’ai envie de te poser…","a"],
["Le petit message que je veux te laisser après avoir parcouru ce site…","a"]]}
];
const QZ=[["Pizza ou sushi ?","Pizza|Sushi"],["Film à la maison ou sortie ?","Film à la maison|Sortie"],["Message ou appel ?","Message|Appel"],["Mer ou montagne ?","Mer|Montagne"]];
const COMP=["Ton sourire donne envie de bien finir la journée.","Tu as une douceur qui met à l’aise.","Ta façon d’être toi, tout simplement, est ce qui me plaît.","Tu rends les moments simples bien plus jolis.","J’aime ta manière de parler quand tu es passionnée.","Tu as un charme qui ne cherche pas à se montrer."];
const RND=["Tu es la meilleure raison de regarder mon téléphone. 📱","Aujourd’hui, souris : quelqu’un pense à toi. 😊","Petit rappel : tu mérites de belles choses. 🌷","Tu fais déjà partie de mes pensées préférées. 💭","Boire de l’eau, respirer, sourire, et m’écrire 😉","Tu es plus jolie que mon fond d’écran. 🌸"];
const N=CATS.length+3;let cur=0,ci=0;

function qh(id,q){const[t,k,o]=q,v=A[id]===undefined?"":A[id];let h=`<div class="q"><label>${t}</label>`;
if(k=="t")h+=`<input type="text" data-id="${id}" value="${esc(v)}" placeholder="Ta réponse…">`;
else if(k=="a")h+=`<textarea data-id="${id}" rows="4" placeholder="Écris librement…">${esc(v)}</textarea>`;
else if(k=="c")h+=`<div class="ch">`+o.split("|").map(x=>`<button type="button" class="chip${v==x?" on":""}" data-id="${id}" data-v="${esc(x)}">${x}</button>`).join("")+`</div>`;
else{const[l,r]=o.split("|");h+=`<input type="range" min="0" max="10" data-id="${id}" value="${v===""?5:v}"><div class="sl"><span>${l}</span><b>${v===""?"—":v}</b><span>${r}</span></div>`}
return h+`</div>`}
const nav=(p,n,lab)=>`<div class="nav">${p!=null?`<button class="btn g" data-go="${p}">← Précédent</button>`:"<span></span>"}${n!=null?`<button class="btn" data-go="${n}">${lab||"Suivant →"}</button>`:""}</div>`;

function view(i){
if(i==0)return `<div class="c" style="padding-top:6vh"><div class="k">Pour toi seulement</div><h1>Madeleine</h1><p class="sub" style="font-size:19px;font-family:var(--d);font-style:italic;color:var(--bo)">« Pour Madeleine, celle qui rend mes journées un peu plus belles. J’ai préparé ce petit univers rien que pour toi. Prends ton temps, réponds sincèrement et surtout, n’oublie pas de sourire. ❤️ »</p><div class="names">Raphaël Sambou MACALOU <i>♡</i> Madeleine Mougnoussin THERA</div><button class="btn glow" data-go="1">Ouvrir mon petit univers ❤️</button><p class="ok" style="margin-top:22px">Touche ♪ en haut pour une ambiance musicale douce (jamais automatique).</p></div>`;
if(i==1)return `<div class="k">Une lettre</div><h2>Pour toi, Madeleine</h2><div class="card letter"><p>Madeleine,</p><p>Notre histoire vient à peine de commencer, et déjà elle me rend plus léger. Je ne veux pas brûler les étapes : j’ai simplement envie de prendre mon temps avec toi.</p><p>J’ai envie d’apprendre à te connaître davantage : tes habitudes, tes rêves, ce qui te rend heureuse, ce qui te fait rire, et surtout ce qui compte vraiment pour toi.</p><p>J’ai préparé ce petit espace pour que tu puisses me le raconter à ta façon, sans pression. Il n’y a ni bonne ni mauvaise réponse, juste toi.</p><p>Merci d’être là.</p><p style="text-align:right;font-style:italic">— Raphaël ❤️</p></div>${nav(0,2,"Commencer →")}`;
if(i>=2&&i<2+CATS.length){const c=CATS[i-2];return `<div class="k">Chapitre ${i-1} sur ${CATS.length}</div><h2>${c.t}</h2><p class="sub">Réponds comme tu le sens. Tes réponses restent en place si tu reviens en arrière.</p><div class="card">${c.q.map((q,j)=>qh((i-2)+"_"+j,q)).join("")}</div>${nav(i-1,i+1)}`}
if(i==N-2)return `<div class="k">Surprises</div><h2>Quelques petits cadeaux</h2><p class="sub">Touche, ouvre, découvre. 🎁</p>
<div class="card c"><button class="btn" data-act="kiss">Appuie ici si tu veux un bisou virtuel 😘</button><div class="ok" id="kmsg"></div></div>
<div class="card c"><div class="env" data-act="env" id="env"><div class="flap"></div>💌</div><div class="rev" id="envr"><p>« Madeleine, si tu lis ceci, c’est que tu as ouvert l’enveloppe, et ça me fait déjà sourire. Merci de me laisser entrer doucement dans ton univers. »</p></div></div>
<div class="card c"><button class="btn g" data-act="comp">Découvrir ce que j’aime chez toi ❤️</button><ul class="rev" id="comp"></ul></div>
<div class="card"><h3>Mini-jeu : notre complicité ⚡</h3>${QZ.map((z,j)=>qh("z"+j,[z[0],"c",z[1]])).join("")}<p class="ok" id="zmsg">Réponds vite, sans réfléchir !</p></div>
<div class="card c"><button class="btn g" data-act="heart" style="font-size:34px;padding:10px 20px">💗</button><div class="rev" id="rnd"></div></div>${nav(i-1,i+1,"Vers la fin →")}`;
return `<div class="c"><div class="k">Merci</div><h1 style="font-size:clamp(38px,11vw,60px)">Notre histoire</h1><div class="card"><p class="letter" style="font-style:italic">« Madeleine, notre histoire ne fait que commencer. Je ne prétends pas être parfait, mais j’ai envie d’apprendre à te connaître, de te faire sourire, de prendre soin de notre complicité et de découvrir avec toi tout ce que cette belle histoire nous réserve. Merci d’être toi. ❤️ »</p></div>
<button class="btn glow" data-act="fin">Un dernier petit mot pour toi 💌</button><div class="rev" id="fin"><p>P.S. : si tu es allée jusqu’ici, tu as gagné un vrai rendez-vous de ma part. Tu choisis le jour, moi j’apporte le sourire. 😘</p></div></div>
<div class="card"><h3>Envoie-moi tes réponses</h3><p class="sub">Rien n’est envoyé tant que tu n’appuies pas : « Envoyer par e-mail » me transmet tes réponses, et WhatsApp s’ouvre avec ton message prêt (il te reste à appuyer sur Envoyer).</p><textarea class="mono" id="out" readonly></textarea><div class="ch" style="margin-top:10px"><button class="btn" data-act="mail">Envoyer par e-mail</button><button class="btn g" data-act="wa">WhatsApp</button><button class="btn g" data-act="copy">Copier</button><button class="btn g" data-act="share" id="shb" hidden>Partager</button></div><div class="ok" id="smsg"></div></div>${nav(i-1,null)}`}

function go(n){cur=Math.max(0,Math.min(N-1,n));const m=$("#app");m.classList.remove("in");setTimeout(()=>{m.innerHTML=view(cur);$("#bar").style.width=(cur/(N-1)*100)+"%";$("#back").style.visibility=cur?"visible":"hidden";if(cur==N-1){$("#out").value=msg();if(navigator.share)$("#shb").hidden=false}window.scrollTo(0,0);m.classList.add("in")},cur?150:0)}

function msg(){let s="💌 Les réponses de Madeleine à son petit univers\n";
CATS.forEach((c,x)=>{const l=[];c.q.forEach((q,j)=>{const v=A[x+"_"+j];if(v!==undefined&&v!=="")l.push("• "+q[0]+"\n   ➜ "+v+(q[1]=="s"?"/10":""))});if(l.length)s+="\n*"+c.t+"*\n"+l.join("\n")});
const z=QZ.map((q,j)=>A["z"+j]?"• "+q[0]+" ➜ "+A["z"+j]:"").filter(Boolean);if(z.length)s+="\n*Mini-jeu*\n"+z.join("\n");return s}

function burst(el,e){const r=el.getBoundingClientRect();for(let i=0;i<14;i++){const s=document.createElement("span");s.className="fl";s.textContent=e[i%e.length];s.style.left=(r.left+r.width/2)+"px";s.style.top=(r.top+r.height/2)+"px";s.style.setProperty("--x",(Math.random()*240-120)+"px");s.style.animationDelay=(i*.06)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2600)}}

let ac,mt,on=0,k=0;const P=[261.6,329.6,392,329.6,220,261.6,329.6,261.6,174.6,220,261.6,220,196,246.9,293.7,246.9];
function nt(f,d){const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.4);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function tick(){nt(P[k%16],3);if(k%4==0)nt(P[k%16]/2,4);k++}
function music(){try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(on){clearInterval(mt);on=0}else{ac.resume();tick();mt=setInterval(tick,1000);on=1}$("#mus").textContent=on?"♫":"♪"}catch(e){}}

document.addEventListener("click",e=>{
const g=e.target.closest("[data-go]");if(g)return go(+g.dataset.go);
const c=e.target.closest(".chip");if(c){const id=c.dataset.id;A[id]=A[id]==c.dataset.v?"":c.dataset.v;save();c.parentNode.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",A[id]==x.dataset.v));if(id[0]=="z"){const n=QZ.filter((_,j)=>A["z"+j]).length;$("#zmsg").textContent=n==QZ.length?"Je note tout ça dans un coin de ma tête 😉":"Réponds vite, sans réfléchir !"}return}
const a=e.target.closest("[data-act]");if(!a)return;const t=a.dataset.act;
if(t=="music")music();
if(t=="kiss"){burst(a,["😘","💋","❤️"]);$("#kmsg").textContent="Bisou bien reçu ? Livraison express, sans frais. 😘"}
if(t=="env"){a.classList.toggle("open");$("#envr").classList.toggle("open")}
if(t=="comp"){const u=$("#comp");u.innerHTML=COMP.map((x,i)=>`<li style="animation-delay:${i*.35}s">❤️ ${x}</li>`).join("");u.classList.add("open");burst(a,["💖","✨"])}
if(t=="heart"){const r=$("#rnd");r.textContent=RND[Math.floor(Math.random()*RND.length)];r.classList.add("open");burst(a,["💗","💕"])}
if(t=="fin"){$("#fin").classList.add("open");burst(a,["🌹","💖","✨","🌸"])}
if(t=="mail"){const b=a;b.disabled=true;$("#smsg").textContent="Envoi en cours…";
fetch(FORM,{method:"POST",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({_subject:"💌 Réponses de Madeleine",message:msg()})})
.then(r=>{if(!r.ok)throw 0;$("#smsg").textContent="Envoyé ✔ Raphaël a bien reçu tes réponses par e-mail. ❤️";burst(b,["💌","❤️"])})
.catch(()=>{b.disabled=false;$("#smsg").textContent="L’envoi par e-mail n’a pas fonctionné. Utilise WhatsApp ou Copier : rien n’est perdu."})}
if(t=="wa"){window.open("https://wa.me/"+NUM+"?text="+encodeURIComponent($("#out").value),"_blank");$("#smsg").textContent="WhatsApp s’ouvre : appuie sur Envoyer pour que le message m’arrive vraiment."}
if(t=="copy"){const o=$("#out");o.value=msg();let ok=0;try{o.select();o.setSelectionRange(0,99999);ok=document.execCommand("copy")}catch(x){}if(!ok&&navigator.clipboard)navigator.clipboard.writeText(o.value).then(()=>{$("#smsg").textContent="Copié ✔ Colle-le dans la conversation de ton choix."});else $("#smsg").textContent=ok?"Copié ✔ Colle-le dans la conversation de ton choix.":"Copie impossible : sélectionne le texte et copie-le à la main."}
if(t=="share")navigator.share({text:msg()}).catch(()=>{})});

document.addEventListener("input",e=>{const el=e.target,id=el.dataset.id;if(!id)return;A[id]=el.value;save();if(el.type=="range")el.nextElementSibling.children[1].textContent=el.value});
$("#back").onclick=()=>go(cur-1);
